<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteFix device sign-in</title><link rel="stylesheet" href="/style.css"><script src="/native-auth.js" defer></script></head>
<body><main><h1>Sign in to QuoteFix on this device</h1><p>Local development only. Your password stays in this browser. The device receives its own revocable session.</p><p id="status" role="status" aria-live="polite"></p>
<form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<button id="authorize" hidden>Allow this device to use my QuoteFix account</button></main></body></html>
